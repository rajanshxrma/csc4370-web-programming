<svg xmlns="http://www.w3.org/2000/svg" width="300" height="320" viewBox="0 0 300 320" role="img" aria-labelledby="title">
  <title id="title">Plain white crew neck t-shirt</title>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.07"/>
      <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <!-- back of the neck, seen through the collar opening -->
  <path d="M116 20 C126 36 174 36 184 20 C172 25 128 25 116 20 Z" fill="#dfe2e7"/>

  <!-- shirt body and sleeves -->
  <path id="shirt" d="M116 20
           C126 40 174 40 184 20
           L238 37
           Q262 45 275 68
           L294 106
           L250 133
           L230 106
           L229 298
           Q150 306 71 298
           L70 106
           L50 133
           L6 106
           L25 68
           Q38 45 62 37 Z"
        fill="url(#cloth)" stroke="#b9bec6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M116 20 C126 40 174 40 184 20 L238 37 Q262 45 275 68 L294 106 L250 133 L230 106 L229 298 Q150 306 71 298 L70 106 L50 133 L6 106 L25 68 Q38 45 62 37 Z"
        fill="url(#sideShade)"/>

  <!-- collar rib -->
  <path d="M116 20 C126 40 174 40 184 20" fill="none" stroke="#c9cdd4" stroke-width="7" stroke-linecap="round"/>
  <path d="M116 20 C126 40 174 40 184 20" fill="none" stroke="#fbfbfc" stroke-width="4" stroke-linecap="round"/>

  <!-- sleeve and bottom hems -->
  <path d="M12 98 L54 124" stroke="#cdd1d7" stroke-width="1.5" fill="none"/>
  <path d="M288 98 L246 124" stroke="#cdd1d7" stroke-width="1.5" fill="none"/>
  <path d="M71 288 Q150 296 229 288" stroke="#cdd1d7" stroke-width="1.5" fill="none"/>

  <!-- soft folds -->
  <path d="M70 106 Q80 150 76 200" stroke="#d9dce1" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M230 106 Q220 160 225 215" stroke="#d9dce1" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M110 250 Q128 270 122 296" stroke="#e1e4e8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M196 238 Q186 262 192 294" stroke="#e1e4e8" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
