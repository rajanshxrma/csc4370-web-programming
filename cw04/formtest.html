<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <title>Sample Form Page</title>
</head> 
<body>
 
<h1>Please sign Up Now!</h1>

<form action="formtest.php" method="post"> 

Your Name: <input name="visitor_name" type="text"> 
<p> 
Password: <input name="password" type="password"> 
</p>
<p> 
<input name="licenseOK" type="checkbox"> I accept the license conditions. 
</p>
<p> 
Specify account type desired:<br> 
<label><input name="account_type" type="radio" value="basic"> Basic ($25)</label><br> 
<label><input name="account_type" type="radio" value="standard" checked> Standard ($50)</label><br> 
<label><input name="account_type" type="radio" value="deluxe"> Deluxe ($100)</label> 
</p>
<input name="userid" type="hidden" value="137273"> 
<p> 
Please select your OS: 
<select name="system"> 
<option selected>Windows</option> 
<option>Mac</option> 
<option>Unix</option> 
</select> 
</p>

<p> 
Please select your optional features:<br> 
<select name="options[]" size="3" multiple> 
<option value="Chat">Chat</option> 
<option value="Email">Email</option> 
<option value="File transfer">File transfer</option> 
<option value="Directory">Directory</option> 
<option value="Shell">Shell</option> 
<option value="Remote control">Remote control</option> 
</select> 
</p>

<p> 
Please write your comments here.<br> 
<textarea name="remarks" rows="10" cols="25">I'm very pleased with your service!!!</textarea> 
</p>

<p> 
<input type="submit" value="Sign Up"> 
<input type="reset">
</p>
 
</form> 

</body> 
</html>
