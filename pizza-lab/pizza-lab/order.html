<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Crust | Pizza practice</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; background: #faf5e9; color: #352b22; }
    form { background: white; padding: 24px; border: 1px solid #ddcfb5; border-radius: 12px; }
    label { display: block; margin: 14px 0 5px; }
    fieldset label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    input:not([type=checkbox]), select, textarea { width: 100%; padding: 10px; font: inherit; border: 1px solid #ac9f8b; border-radius: 6px; }
    input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
    fieldset { border: 1px solid #ddcfb5; border-radius: 6px; margin: 18px 0; padding: 10px 16px; }
    legend { padding: 0 6px; }
    button { margin-top: 20px; background: #a53d23; color: white; padding: 12px 20px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #1d6fa5; outline-offset: 2px; }
    small { color: #65594a; }
  </style>
</head>
<body>
  <h1>Campus Crust</h1>
  <p>Build a pizza. Practice PHP. Use a fictional name.</p>
  <p><small>Classroom exercise only. Nothing is purchased, saved, or sent to a kitchen.</small></p>
  <form action="order.php" method="post">
    <label for="chef">Chef name (required)</label>
    <input id="chef" name="customer" type="text" maxlength="40" required>

    <label for="pizza-size">Pizza size (required)</label>
    <select id="pizza-size" name="size">
      <option value="small">Small ($8)</option>
      <option value="medium" selected>Medium ($10)</option>
      <option value="large">Large ($12)</option>
    </select>

    <label for="crust">Crust (required)</label>
    <select id="crust" name="crust">
      <option value="thin" selected>Thin</option>
      <option value="thick">Thick</option>
    </select>

    <!-- TODO A: done. quantity, toppings[] and notes below. The name attribute is what PHP sees, the id is only for the label. -->
    <label for="quantity">How many pizzas? (1-5, required)</label>
    <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" max="5" step="1" value="1" required>

    <fieldset>
      <legend>Toppings (optional)</legend>
      <label for="mushroom"><input id="mushroom" name="toppings[]" type="checkbox" value="mushroom"> Mushroom</label>
      <label for="olive"><input id="olive" name="toppings[]" type="checkbox" value="olive"> Olive</label>
      <label for="pineapple"><input id="pineapple" name="toppings[]" type="checkbox" value="pineapple"> Pineapple</label>
    </fieldset>

    <label for="notes">Kitchen note (optional, up to 200 bytes)</label>
    <textarea id="notes" name="notes" rows="3" maxlength="200" placeholder="Extra crispy, please!"></textarea>

    <button type="submit">Make my practice ticket</button>
  </form>
</body>
</html>
